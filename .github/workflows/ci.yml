name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict "outputs/Output Tray.app"
